<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
  <title>Super App Sekolah Terpadu</title>

  <!-- PWA Meta Tags -->
  <meta name="description" content="Aplikasi manajemen sekolah terpadu" />
  <meta name="theme-color" content="#2563eb" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Super App Sekolah" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="msapplication-TileColor" content="#2563eb" />

  <!-- PWA Manifest -->
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
  <link rel="icon" type="image/png" sizes="32x32"  href="/icons/icon-32.png" />

  <!-- Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet" />

  <!-- Tailwind CDN with Design Tokens -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50:  '#eff6ff',
              100: '#dbeafe',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8'
            },
            accent: {
              500: '#7c3aed',
              600: '#6d28d9'
            }
          },
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'ui-sans-serif', 'system-ui', 'sans-serif']
          }
        }
      }
    }
  </script>
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Lucide Icons (defer) -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js" defer></script>

  <!-- SweetAlert2 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11" defer></script>

  <!-- App Stylesheet -->
  <link rel="stylesheet" href="css/app.css" />

  <!-- App Configuration (GAS API URL) -->
  <script src="config.js"></script>

  <!-- JS: Core -->
  <script src="js/core/utils.js"  defer></script>
  <script src="js/core/api.js"    defer></script>
  <script src="js/core/auth.js"   defer></script>

  <!-- JS: Components -->
  <script src="js/components/toast.js"      defer></script>
  <script src="js/components/modal.js"      defer></script>
  <script src="js/components/skeleton.js"   defer></script>
  <script src="js/components/bottomNav.js"  defer></script>
  <script src="js/components/sidebar.js"    defer></script>

  <!-- JS: Views -->
  <script src="js/views/landing.js"   defer></script>
  <script src="js/views/siswa.js"     defer></script>
  <script src="js/views/guru.js"      defer></script>
  <script src="js/views/kepsek.js"    defer></script>
  <script src="js/views/admin.js"     defer></script>
  <script src="js/views/router.js"    defer></script>

  <!-- JS: Main App Controller -->
  <script src="js/app.js"             defer></script>
</head>
<body class="bg-gray-50 font-sans antialiased">

  <!-- Loading Overlay (thin spinner, not fullscreen dark) -->
  <div id="loading-overlay"
       class="fixed inset-0 z-[9999] flex items-center justify-center bg-white/80 backdrop-blur-sm
              transition-opacity duration-300 pointer-events-none">
    <div class="flex flex-col items-center gap-3">
      <div class="h-8 w-8 animate-spin rounded-full
                  border-2 border-brand-100 border-t-brand-600"></div>
      <span class="text-sm font-medium text-gray-500">Memuat aplikasi…</span>
    </div>
  </div>

  <!-- ── Topbar ──────────────────────────────────────────── -->
  <header id="topbar"
          class="sticky top-0 z-50 h-14 bg-white border-b border-gray-200 shadow-sm">
    <div class="flex items-center justify-between h-full px-4 max-w-screen-xl mx-auto">

      <!-- Logo + School Name -->
      <div class="flex items-center gap-2 min-w-0">
        <div class="flex-shrink-0 w-8 h-8 rounded-lg bg-brand-600
                    flex items-center justify-center">
          <i data-lucide="graduation-cap" class="w-4 h-4 text-white"></i>
        </div>
        <span id="topbar-school-name"
              class="text-sm font-bold text-gray-800 truncate max-w-[180px] md:max-w-xs">
          Super App Sekolah
        </span>
      </div>

      <!-- Right Controls -->
      <div class="flex items-center gap-2">

        <!-- User Pill (hidden before login) -->
        <div id="user-pill"
             class="hidden items-center gap-1.5 px-2.5 py-1 rounded-full
                    bg-brand-50 border border-brand-100
                    text-xs font-medium text-brand-700
                    cursor-pointer hover:bg-brand-100 transition-colors select-none">
          <i data-lucide="user-circle-2" class="w-3.5 h-3.5"></i>
          <span id="user-pill-name">—</span>
        </div>

        <!-- DB Connect Button -->
        <button id="btn-db-connect" title="Koneksi Database"
                class="flex items-center gap-1 px-2 py-1 rounded-md text-xs font-medium
                       text-gray-500 border border-gray-200
                       hover:border-brand-400 hover:text-brand-600 transition-colors">
          <i data-lucide="database" class="w-3 h-3"></i>
          <span class="hidden sm:inline">DB</span>
          <span id="db-status-dot"
                class="w-1.5 h-1.5 rounded-full bg-gray-300"></span>
        </button>

        <!-- Install PWA Button (shown after beforeinstallprompt) -->
        <button id="btn-pwa-install" title="Pasang Aplikasi"
                class="hidden items-center gap-1 px-2 py-1 rounded-md text-xs font-medium
                       text-gray-500 border border-gray-200
                       hover:border-accent-500 hover:text-accent-500 transition-colors">
          <i data-lucide="download" class="w-3 h-3"></i>
          <span class="hidden sm:inline">Pasang</span>
        </button>

        <!-- Logout Button (hidden before login) -->
        <button id="btn-logout" title="Keluar"
                class="hidden items-center gap-1 px-2 py-1 rounded-md text-xs font-medium
                       text-red-500 border border-red-200
                       hover:bg-red-50 transition-colors">
          <i data-lucide="log-out" class="w-3 h-3"></i>
          <span class="hidden sm:inline">Keluar</span>
        </button>

      </div><!-- /right controls -->
    </div>
  </header>

  <!-- ── App Root — views injected by JS ───────────────── -->
  <main id="app-root" class="page-transition min-h-[calc(100vh-3.5rem)]"></main>

  <!-- ── Bottom Nav Container (Siswa Mobile) ──────────────── -->
  <div id="bottom-nav-container"></div>

  <!-- ── Toast Container ───────────────────────────────── -->
  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <!-- ── PWA + Boot ────────────────────────────────────── -->
  <script>
    // Service Worker registration
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('/sw.js').catch(function () {});
      });
    }

    // Capture PWA install prompt
    window._pwaInstallPrompt = null;
    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      window._pwaInstallPrompt = e;
      var btn = document.getElementById('btn-pwa-install');
      if (btn) { btn.style.display = 'flex'; }
    });

    // Boot — wait for all deferred scripts
    window.addEventListener('DOMContentLoaded', function () {
      if (typeof App !== 'undefined') App.init();
    });
  </script>

</body>
</html>
